# fly.toml app configuration file generated for bookaria-zerotts on 2026-11-25T13:38:34+07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'bookaria-zerotts'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
